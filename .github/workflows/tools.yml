name: tools

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/tools.yml"
  pull_request:
    paths:
      - "tools/**"
      - ".github/workflows/tools.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests (no Minecraft, no network)
        run: python -m unittest discover -s tools/tests -v

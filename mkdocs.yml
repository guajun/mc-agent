site_name: mc-agent
site_description: Let an agent observe, drive and fork a Minecraft world.
site_url: https://guajun.github.io/mc-agent/
repo_url: https://github.com/guajun/mc-agent
repo_name: guajun/mc-agent
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Installation: install.md
  - Getting started: getting-started.md
  - Concepts:
      - How it fits together: concepts.md
      - Who is the agent in game: player-identity.md
      - Forking a live world: protocol-snapshot.md
  - Guides:
      - Running the agent on Hermes: hermes-setup.md
      - Installing the Toolkit Skill: toolkit-skill.md
      - "Unattended Hermes: webhook + Skill": hermes-unattended.md
      - Headless lab servers: lab-server.md
      - Building a mod for a lab: mod-building.md
      - Checking a fork: fork-verify.md
  - Reference:
      - Tools: tools.md
      - Troubleshooting: troubleshooting.md
  - RFCs:
      - "0001: agent interface and bridge": rfc/0001-agent-interface.md
      - "0002: programmable tool calls": rfc/0002-programmable-tool-calls.md

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
        - locale: zh
          name: 中文
          site_description: 让智能体观测、驱动并分叉一个 Minecraft 世界。
          theme:
            language: zh
          nav_translations:
            Home: 首页
            Installation: 安装
            Getting started: 快速开始
            Concepts: 概念
            How it fits together: 整体结构
            Who is the agent in game: 智能体在游戏里是谁
            Forking a live world: 分叉一个活的世界
            Guides: 指南
            Running the agent on Hermes: 用 Hermes 运行智能体
            Installing the Toolkit Skill: 安装 Toolkit Skill
            "Unattended Hermes: webhook + Skill": "Hermes 无人值守：webhook + Skill"
            Headless lab servers: 无头实验室服务器
            Building a mod for a lab: 为实验室构建 mod
            Checking a fork: 校验一次分叉
            Reference: 参考
            Tools: 工具
            Troubleshooting: 疑难排查
            RFCs: RFC 提案

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
